<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOD MODS - MediaFire Style Cloud</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --danger: #ef4444;
            --dark: #1f2937;
            --gray: #6b7280;
            --light: #f9fafb;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
            --radius: 12px;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4ff;
            color: var(--dark);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Navbar */
        .navbar {
            background: white;
            box-shadow: var(--shadow);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-brand i {
            color: var(--primary);
            font-size: 2rem;
        }
        
        .nav-brand h1 {
            font-size: 1.5rem;
        }
        
        .nav-brand span {
            color: var(--primary);
        }
        
        /* Upload Section */
        .upload-section {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin: 30px 0;
        }
        
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: var(--radius);
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background: rgba(37, 99, 235, 0.05);
            border-color: var(--primary);
        }
        
        .upload-area i {
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.6;
        }
        
        .upload-area h3 {
            margin: 15px 0 5px;
            font-size: 1.3rem;
        }
        
        .upload-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }
        
        #fileInput { display: none; }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .stat-icon.blue { background: var(--primary); }
        .stat-icon.green { background: var(--secondary); }
        .stat-icon.orange { background: #f59e0b; }
        .stat-icon.purple { background: #8b5cf6; }
        
        .stat-info h3 { font-size: 1.5rem; }
        .stat-info p { color: var(--gray); font-size: 0.9rem; }
        
        /* Files Grid */
        .files-section {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
        }
        
        .files-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .file-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }
        
        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .file-top {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        
        .file-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        
        .file-actions {
            display: flex;
            gap: 8px;
        }
        
        .file-action-btn {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .file-action-btn:hover {
            background: #f3f4f6;
        }
        
        .file-action-btn.download:hover {
            background: var(--secondary);
            color: white;
        }
        
        .file-action-btn.share:hover {
            background: var(--primary);
            color: white;
        }
        
        .file-action-btn.delete:hover {
            background: var(--danger);
            color: white;
        }
        
        .file-name {
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .file-meta {
            font-size: 0.85rem;
            color: var(--gray);
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }
        
        .file-link-box {
            background: #f3f4f6;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-link-box input {
            border: none;
            background: transparent;
            width: 70%;
            font-size: 0.8rem;
            color: var(--gray);
            outline: none;
        }
        
        .no-files {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }
        
        .no-files i {
            font-size: 4rem;
            opacity: 0.3;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--dark);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            display: none;
            z-index: 9999;
            max-width: 400px;
        }
        
        .toast.success { background: var(--secondary); }
        .toast.error { background: var(--danger); }
        
        /* Responsive */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .files-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <div class="nav-brand">
                <i class="fas fa-cloud"></i>
                <h1>JOD MODS <span>CLOUD</span></h1>
            </div>
            <div>
                <button onclick="refreshFiles()" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--gray);">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-database"></i></div>
                <div class="stat-info">
                    <h3 id="storageUsed">0 MB</h3>
                    <p>Storage Used</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-file"></i></div>
                <div class="stat-info">
                    <h3 id="fileCount">0</h3>
                    <p>Total Files</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fas fa-download"></i></div>
                <div class="stat-info">
                    <h3 id="downloadCount">0</h3>
                    <p>Total Downloads</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-share-alt"></i></div>
                <div class="stat-info">
                    <h3 id="sharedCount">0</h3>
                    <p>Shared Files</p>
                </div>
            </div>
        </div>
        
        <!-- Upload -->
        <section class="upload-section">
            <h2><i class="fas fa-cloud-upload-alt"></i> Upload Files</h2>
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>Drag & Drop or Click to Upload</h3>
                <p>Max file size: 100MB (IndexedDB limit)</p>
                <input type="file" id="fileInput" multiple>
            </div>
            <button class="upload-btn" id="uploadBtn">
                <i class="fas fa-upload"></i> Upload to Cloud
            </button>
        </section>
        
        <!-- Files -->
        <section class="files-section">
            <div class="files-header">
                <h2><i class="fas fa-folder"></i> My Files</h2>
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()" style="padding: 8px 20px; font-size: 0.9rem; margin:0;">
                    <i class="fas fa-plus"></i> Add Files
                </button>
            </div>
            <div id="filesGrid" class="files-grid"></div>
            <div id="noFiles" class="no-files" style="display:none;">
                <i class="fas fa-cloud"></i>
                <h3>No files uploaded</h3>
                <p>Upload your first file to get started</p>
            </div>
        </section>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // =============================================
        // MEDIAFIRE STYLE - IndexedDB + LocalStorage
        // =============================================
        
        let db = null;
        let files = [];
        let totalDownloads = 0;
        
        // Open IndexedDB
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('JODModsDB', 1);
                
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        const store = db.createObjectStore('files', { keyPath: 'id' });
                        store.createIndex('name', 'name', { unique: false });
                        store.createIndex('uploadDate', 'uploadDate', { unique: false });
                    }
                };
                
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                
                request.onerror = (e) => {
                    reject(e.target.error);
                };
            });
        }
        
        // Save file to IndexedDB
        function saveFileToDB(fileData) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['files'], 'readwrite');
                const store = transaction.objectStore('files');
                const request = store.add(fileData);
                
                request.onsuccess = () => resolve(true);
                request.onerror = () => reject(request.error);
            });
        }
        
        // Get all files from IndexedDB
        function getAllFiles() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['files'], 'readonly');
                const store = transaction.objectStore('files');
                const request = store.getAll();
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        
        // Delete file from IndexedDB
        function deleteFileFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['files'], 'readwrite');
                const store = transaction.objectStore('files');
                const request = store.delete(id);
                
                request.onsuccess = () => resolve(true);
                request.onerror = () => reject(request.error);
            });
        }
        
        // Generate unique ID
        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        // Format file size
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }
        
        // Get file icon
        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                'pdf': 'fa-file-pdf',
                'doc': 'fa-file-word', 'docx': 'fa-file-word',
                'xls': 'fa-file-excel', 'xlsx': 'fa-file-excel',
                'ppt': 'fa-file-powerpoint', 'pptx': 'fa-file-powerpoint',
                'jpg': 'fa-file-image', 'jpeg': 'fa-file-image', 'png': 'fa-file-image', 'gif': 'fa-file-image',
                'mp4': 'fa-file-video', 'avi': 'fa-file-video', 'mov': 'fa-file-video',
                'mp3': 'fa-file-audio', 'wav': 'fa-file-audio',
                'zip': 'fa-file-archive', 'rar': 'fa-file-archive', '7z': 'fa-file-archive',
                'txt': 'fa-file-alt',
                'js': 'fa-file-code', 'html': 'fa-file-code', 'css': 'fa-file-code'
            };
            return icons[ext] || 'fa-file';
        }
        
        // Get color for file type
        function getFileColor(name) {
            const ext = name.split('.').pop().toLowerCase();
            const colors = {
                'pdf': '#e74c3c',
                'doc': '#2b579a', 'docx': '#2b579a',
                'xls': '#217346', 'xlsx': '#217346',
                'ppt': '#d24726', 'pptx': '#d24726',
                'jpg': '#e67e22', 'jpeg': '#e67e22', 'png': '#e67e22', 'gif': '#e67e22',
                'mp4': '#3498db', 'avi': '#3498db', 'mov': '#3498db',
                'mp3': '#9b59b6', 'wav': '#9b59b6',
                'zip': '#f39c12', 'rar': '#f39c12',
                'txt': '#2c3e50',
                'js': '#f1c40f', 'html': '#e74c3c', 'css': '#3498db'
            };
            return colors[ext] || '#6366f1';
        }
        
        // Show toast
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.style.display = 'none', 3000);
        }
        
        // Upload files
        async function uploadFiles(fileList) {
            const btn = document.getElementById('uploadBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            btn.disabled = true;
            
            let uploaded = 0;
            
            for (let file of fileList) {
                try {
                    const reader = new FileReader();
                    
                    const fileData = await new Promise((resolve, reject) => {
                        reader.onload = (e) => {
                            const id = generateId();
                            resolve({
                                id: id,
                                name: file.name,
                                size: file.size,
                                sizeFormatted: formatSize(file.size),
                                type: file.type || 'application/octet-stream',
                                data: e.target.result,
                                uploadDate: new Date().toISOString().split('T')[0],
                                downloadCount: 0,
                                shareLink: `${window.location.origin}${window.location.pathname}?file=${id}`
                            });
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    
                    await saveFileToDB(fileData);
                    uploaded++;
                    
                } catch (error) {
                    console.error('Upload error:', error);
                    showToast('Failed to upload: ' + file.name, 'error');
                }
            }
            
            btn.innerHTML = originalText;
            btn.disabled = false;
            document.getElementById('fileInput').value = '';
            
            if (uploaded > 0) {
                showToast(`${uploaded} file(s) uploaded successfully!`, 'success');
                loadFiles();
            }
        }
        
        // Load files from IndexedDB
        async function loadFiles() {
            try {
                files = await getAllFiles();
                displayFiles();
                updateStats();
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }
        
        // Display files
        function displayFiles() {
            const grid = document.getElementById('filesGrid');
            const noFiles = document.getElementById('noFiles');
            
            if (files.length === 0) {
                grid.innerHTML = '';
                noFiles.style.display = 'block';
                return;
            }
            noFiles.style.display = 'none';
            
            grid.innerHTML = files.map(file => `
                <div class="file-card">
                    <div class="file-top">
                        <div class="file-icon" style="background: ${getFileColor(file.name)};">
                            <i class="fas ${getFileIcon(file.name)}"></i>
                        </div>
                        <div class="file-actions">
                            <button class="file-action-btn download" onclick="downloadFile('${file.id}')">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="file-action-btn share" onclick="shareFile('${file.id}')">
                                <i class="fas fa-share-alt"></i>
                            </button>
                            <button class="file-action-btn delete" onclick="deleteFile('${file.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="file-name" title="${file.name}">${truncateName(file.name)}</div>
                    <div class="file-meta">
                        <span><i class="fas fa-hdd"></i> ${file.sizeFormatted}</span>
                        <span><i class="fas fa-calendar"></i> ${file.uploadDate}</span>
                        <span><i class="fas fa-download"></i> ${file.downloadCount}</span>
                    </div>
                    <div class="file-link-box">
                        <input type="text" value="${file.shareLink}" readonly>
                        <button onclick="copyLink('${file.shareLink}')" style="background: none; border: none; cursor: pointer; color: var(--primary);">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function truncateName(name, max = 20) {
            return name.length > max ? name.substring(0, max) + '...' : name;
        }
        
        // Update stats
        function updateStats() {
            const totalSize = files.reduce((sum, f) => sum + f.size, 0);
            const totalDownloads = files.reduce((sum, f) => sum + f.downloadCount, 0);
            
            document.getElementById('storageUsed').textContent = formatSize(totalSize);
            document.getElementById('fileCount').textContent = files.length;
            document.getElementById('downloadCount').textContent = totalDownloads;
            document.getElementById('sharedCount').textContent = files.length;
        }
        
        // Download file
        function downloadFile(id) {
            const file = files.find(f => f.id === id);
            if (!file) {
                showToast('File not found', 'error');
                return;
            }
            
            // Increment download count
            file.downloadCount++;
            saveFileToDB(file); // Update in DB
            updateStats();
            
            // Download
            const link = document.createElement('a');
            link.href = file.data;
            link.download = file.name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast(`Downloading ${file.name}...`, 'success');
        }
        
        // Share file
        function shareFile(id) {
            const file = files.find(f => f.id === id);
            if (!file) return;
            
            if (navigator.share) {
                navigator.share({
                    title: file.name,
                    text: `Download ${file.name} from JOD MODS CLOUD`,
                    url: file.shareLink
                }).catch(() => {});
            } else {
                copyLink(file.shareLink);
            }
        }
        
        // Copy link
        function copyLink(link) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link)
                    .then(() => showToast('Link copied to clipboard!', 'success'))
                    .catch(() => fallbackCopy(link));
            } else {
                fallbackCopy(link);
            }
        }
        
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('Link copied to clipboard!', 'success');
        }
        
        // Delete file
        async function deleteFile(id) {
            if (!confirm('Delete this file permanently?')) return;
            
            try {
                await deleteFileFromDB(id);
                files = files.filter(f => f.id !== id);
                displayFiles();
                updateStats();
                showToast('File deleted successfully', 'success');
            } catch (error) {
                showToast('Error deleting file', 'error');
            }
        }
        
        // Refresh files
        function refreshFiles() {
            loadFiles();
            showToast('Files refreshed', 'success');
        }
        
        // Check for share link in URL
        function checkShareLink() {
            const params = new URLSearchParams(window.location.search);
            const fileId = params.get('file');
            
            if (fileId) {
                const file = files.find(f => f.id === fileId);
                if (file) {
                    showToast(`Downloading ${file.name}...`, 'success');
                    setTimeout(() => downloadFile(fileId), 1000);
                }
            }
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', async () => {
            await openDB();
            await loadFiles();
            checkShareLink();
            
            // Upload events
            document.getElementById('uploadArea').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            
            document.getElementById('uploadBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            
            document.getElementById('fileInput').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    uploadFiles(e.target.files);
                }
            });
            
            // Drag and drop
            const uploadArea = document.getElementById('uploadArea');
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--secondary)';
                uploadArea.style.background = 'rgba(16, 185, 129, 0.05)';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = 'var(--primary)';
                uploadArea.style.background = 'transparent';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--primary)';
                uploadArea.style.background = 'transparent';
                uploadFiles(e.dataTransfer.files);
            });
        });
        
        // Global functions
        window.downloadFile = downloadFile;
        window.shareFile = shareFile;
        window.deleteFile = deleteFile;
        window.copyLink = copyLink;
        window.refreshFiles = refreshFiles;
    </script>
</body>
</html>
