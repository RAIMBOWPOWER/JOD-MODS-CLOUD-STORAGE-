<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOD MODS Cloud</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0b0a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
        
        .upload-area {
            border: 2px dashed rgba(124,58,237,0.3);
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.03);
        }
        .upload-area:hover { border-color: #7c3aed; background: rgba(124,58,237,0.05); }
        .upload-area i { font-size: 48px; color: #7c3aed; opacity: 0.5; }
        .upload-area h3 { margin: 12px 0 4px; font-size: 18px; }
        .upload-area p { color: #777; font-size: 14px; }
        .upload-area .badge {
            display: inline-block;
            background: rgba(124,58,237,0.12);
            color: #a78bfa;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 12px;
            margin-top: 10px;
        }
        #fileInput { display: none; }
        
        .progress-container {
            display: none;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
        }
        .progress-container.active { display: block; }
        .progress-bar {
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed, #a78bfa);
            border-radius: 8px;
            transition: width 0.3s;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }
        
        .file-list { margin-top: 24px; text-align: left; }
        .file-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .file-item .name { font-weight: 600; font-size: 14px; word-break: break-word; }
        .file-item .size { color: #666; font-size: 12px; }
        .file-item .actions { display: flex; gap: 6px; }
        .file-item .actions button {
            padding: 5px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-download { background: #7c3aed; color: #fff; }
        .btn-download:hover { background: #6d28d9; }
        .btn-share { background: rgba(255,255,255,0.08); color: #aaa; }
        .btn-share:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .btn-delete { background: rgba(239,68,68,0.15); color: #ef4444; }
        .btn-delete:hover { background: rgba(239,68,68,0.25); }
        
        .no-files { text-align: center; padding: 30px 20px; color: #555; }
        .no-files i { font-size: 32px; opacity: 0.3; margin-bottom: 8px; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            background: #1a1833;
            border: 1px solid rgba(124,58,237,0.15);
            display: none;
            z-index: 999;
            font-size: 14px;
            max-width: 90%;
            text-align: center;
        }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }
        
        .footer { margin-top: 30px; color: #444; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">☁️ JOD MODS CLOUD</div>
    <div class="subtitle">Upload any file • 2GB limit • Free & Secure</div>
    
    <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt"></i>
        <h3>📁 Click or Drop Files Here</h3>
        <p>All file types supported • Max 2GB</p>
        <div class="badge"><i class="fas fa-lock"></i> Private • Secure</div>
        <input type="file" id="fileInput" multiple>
    </div>
    
    <div class="progress-container" id="progressContainer">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#aaa;">
            <span id="progressName">Uploading...</span>
            <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text">
            <span id="progressUploaded">0 MB</span>
            <span id="progressSpeed">0 MB/s</span>
        </div>
    </div>
    
    <div class="file-list" id="fileList">
        <div class="no-files">
            <i class="fas fa-cloud"></i>
            <p>No files uploaded yet</p>
        </div>
    </div>
    
    <div class="footer">JOD MODS Cloud &bull; Powered by Google Drive</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ✅ TERA PERSONAL API URL (Already Deployed)
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbz7G6n8pVV6QgX6y3XIvW9jyJjfNE-hlWv_8CCqL1dMQeey0VWrT-azv7jZLY85K__ILA/exec';

// ============================================================
// STATE
// ============================================================
let fileList = [];

// ============================================================
// HELPERS
// ============================================================
function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
    return (bytes/1073741824).toFixed(2) + ' GB';
}

function getFileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const map = {
        'pdf': 'fa-file-pdf', 'doc': 'fa-file-word', 'docx': 'fa-file-word',
        'xls': 'fa-file-excel', 'xlsx': 'fa-file-excel',
        'ppt': 'fa-file-powerpoint', 'pptx': 'fa-file-powerpoint',
        'jpg': 'fa-file-image', 'jpeg': 'fa-file-image', 'png': 'fa-file-image',
        'mp4': 'fa-file-video', 'mp3': 'fa-file-audio',
        'zip': 'fa-file-archive', 'rar': 'fa-file-archive',
        'txt': 'fa-file-alt'
    };
    return map[ext] || 'fa-file';
}

function toast(msg, type='info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + type;
    el.style.display = 'block';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ============================================================
// UPLOAD
// ============================================================
async function uploadFiles(files) {
    if (!files || !files.length) return;
    
    const progress = document.getElementById('progressContainer');
    progress.classList.add('active');
    
    let uploaded = 0;
    let totalBytes = 0;
    let uploadedBytes = 0;
    
    for (let f of files) totalBytes += f.size;
    
    for (let file of files) {
        document.getElementById('progressName').textContent = '📤 ' + file.name;
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            const xhr = new XMLHttpRequest();
            const startTime = Date.now();
            
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progressFill').style.width = pct + '%';
                    document.getElementById('progressPct').textContent = pct + '%';
                    document.getElementById('progressUploaded').textContent = formatSize(e.loaded);
                    
                    const speed = e.loaded / 1024 / 1024 / ((Date.now() - startTime) / 1000);
                    document.getElementById('progressSpeed').textContent = speed.toFixed(1) + ' MB/s';
                }
            };
            
            const response = await new Promise((resolve, reject) => {
                xhr.open('POST', API_URL);
                xhr.onload = () => {
                    if (xhr.status === 200) {
                        try { resolve(JSON.parse(xhr.responseText)); } 
                        catch(e) { reject(new Error('Invalid response')); }
                    } else {
                        reject(new Error('Upload failed: ' + xhr.status));
                    }
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(formData);
            });
            
            if (response.success) {
                uploaded++;
                uploadedBytes += file.size;
                fileList.unshift({
                    id: response.fileId,
                    name: response.name,
                    size: response.size,
                    sizeFormatted: formatSize(response.size),
                    downloadUrl: response.downloadUrl
                });
                toast('✅ ' + file.name + ' uploaded!', 'success');
            } else {
                toast('❌ ' + file.name + ' failed: ' + (response.error || 'Unknown'), 'error');
            }
            
        } catch (error) {
            console.error('Upload error:', error);
            toast('❌ ' + file.name + ' failed: ' + error.message, 'error');
        }
    }
    
    setTimeout(() => {
        progress.classList.remove('active');
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('progressPct').textContent = '0%';
    }, 1000);
    
    if (uploaded > 0) {
        renderFiles();
        saveFiles();
    }
}

// ============================================================
// RENDER FILES
// ============================================================
function renderFiles() {
    const container = document.getElementById('fileList');
    
    if (fileList.length === 0) {
        container.innerHTML = `
            <div class="no-files">
                <i class="fas fa-cloud"></i>
                <p>No files uploaded yet</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = fileList.map(f => `
        <div class="file-item">
            <div>
                <div class="name"><i class="fas ${getFileIcon(f.name)}" style="color:#7c3aed;margin-right:8px;"></i>${f.name}</div>
                <div class="size">📦 ${f.sizeFormatted}</div>
            </div>
            <div class="actions">
                <button class="btn-download" onclick="downloadFile('${f.id}')"><i class="fas fa-download"></i></button>
                <button class="btn-share" onclick="shareFile('${f.downloadUrl}', '${f.name}')"><i class="fas fa-share"></i></button>
                <button class="btn-delete" onclick="deleteFile('${f.id}')"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

// ============================================================
// DOWNLOAD
// ============================================================
function downloadFile(fileId) {
    const file = fileList.find(f => f.id === fileId);
    if (!file) { toast('❌ File not found', 'error'); return; }
    window.open(file.downloadUrl, '_blank');
    toast('⬇ Downloading...', 'success');
}

// ============================================================
// SHARE
// ============================================================
function shareFile(url, name) {
    if (navigator.share) {
        navigator.share({ title: name, text: '📁 ' + name + ' - JOD MODS Cloud', url: url })
            .catch(() => {});
    } else {
        copyToClipboard(url);
        toast('📋 Link copied!', 'success');
    }
}

function copyToClipboard(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
    } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
    }
}

// ============================================================
// DELETE
// ============================================================
function deleteFile(fileId) {
    if (!confirm('Delete this file?')) return;
    fileList = fileList.filter(f => f.id !== fileId);
    renderFiles();
    saveFiles();
    toast('🗑️ File deleted', 'success');
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveFiles() {
    try { localStorage.setItem('jod_files', JSON.stringify(fileList)); } catch(e) {}
}

function loadSavedFiles() {
    try {
        const saved = localStorage.getItem('jod_files');
        if (saved) {
            fileList = JSON.parse(saved);
            renderFiles();
        }
    } catch(e) {}
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    loadSavedFiles();
    
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    
    uploadArea.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', function() {
        if (this.files.length) {
            uploadFiles(this.files);
            this.value = '';
        }
    });
    
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#7c3aed';
        uploadArea.style.background = 'rgba(124,58,237,0.08)';
    });
    
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.borderColor = 'rgba(124,58,237,0.3)';
        uploadArea.style.background = 'transparent';
    });
    
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = 'rgba(124,58,237,0.3)';
        uploadArea.style.background = 'transparent';
        if (e.dataTransfer.files.length) {
            uploadFiles(e.dataTransfer.files);
        }
    });
});

console.log('🚀 JOD MODS Cloud Ready!');
console.log('📁 API URL:', API_URL);
</script>
</body>
</html>
